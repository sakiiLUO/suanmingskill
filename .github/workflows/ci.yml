name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependency
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Unit tests (历法不变量 + CLI + 回复规则)
        run: python -m unittest discover -s tests -v

      - name: Package validation (结构/引用/许可/禁用内容)
        run: python scripts/validate_skill.py --verbose

      - name: Dialogue red-team cases
        run: python scripts/eval_dialogue.py

      - name: Smoke test (排盘 + 合盘)
        run: |
          python scripts/paipan.py --birth "1995-08-17 14:30" --gender male --city 杭州 --format brief
          python scripts/paipan.py --birth "1995-08-17 14:30" --gender male --city 杭州 --save /tmp/a.json
          python scripts/paipan.py --birth "1996-03-08 09:15" --gender female --city 北京 --save /tmp/b.json
          python scripts/hepan.py --a-json /tmp/a.json --b-json /tmp/b.json > /tmp/hepan.json

